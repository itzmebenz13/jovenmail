<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claude Test</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      max-width: 800px;
      margin: 40px auto;
      padding: 20px;
    }

    textarea {
      width: 100%;
      height: 120px;
    }

    button {
      padding: 10px 20px;
      margin-top: 10px;
      cursor: pointer;
    }

    #output {
      margin-top: 20px;
      white-space: pre-wrap;
      border: 1px solid #ccc;
      padding: 15px;
      min-height: 100px;
    }
  </style>
</head>
<body>

<h2>Claude Opus 4.6 Test</h2>

<textarea id="prompt">Hello!</textarea>

<br>

<button onclick="chat()">Send</button>

<div id="output">Ready.</div>

<script>
async function chat() {
  const output = document.getElementById("output");

  output.textContent = "Thinking...";

  try {
    const response = await fetch(
      "https://fancy-meadow-f427.macaraigdaniel92.workers.dev/",
      {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify({
          model: "claude-opus-4-6",
          messages: [
            {
              role: "user",
              content: document.getElementById("prompt").value
            }
          ]
        })
      }
    );

    const text = await response.text();

    console.log("RAW RESPONSE:");
    console.log(text);

    try {
      const data = JSON.parse(text);

      if (data.content?.[0]?.text) {
        output.textContent = data.content[0].text;
      }
      else if (data.choices?.[0]?.message?.content) {
        output.textContent =
          data.choices[0].message.content;
      }
      else {
        output.textContent =
          JSON.stringify(data, null, 2);
      }

    } catch {
      output.textContent = text;
    }

  } catch (err) {
    output.textContent =
      "ERROR:\n\n" + err.message;
  }
}
</script>

</body>
</html>
