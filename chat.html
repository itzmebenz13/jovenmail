<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Claude Test</title>
</head>
<body>

  <h2>Claude Opus 4.6 Test</h2>

  <textarea id="prompt" rows="6" cols="60">Hello!</textarea>
  <br><br>

  <button onclick="chat()">Send</button>

  <h3>Response</h3>
  <pre id="output">Waiting...</pre>

  <script>
    async function chat() {
      const output = document.getElementById("output");
      output.textContent = "Thinking...";

      try {
        const response = await fetch(
          "https://https://fancy-meadow-f427.macaraigdaniel92.workers.dev/",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              model: "claude-opus-4-6",
              max_tokens: 500,
              messages: [
                {
                  role: "user",
                  content: document.getElementById("prompt").value
                }
              ]
            })
          }
        );

        const data = await response.json();

        console.log(data);

        // Claude-style response
        if (data.content && data.content[0]) {
          output.textContent = data.content[0].text;
        }
        // OpenAI-style response
        else if (data.choices && data.choices[0]) {
          output.textContent =
            data.choices[0].message.content;
        }
        // Unknown response
        else {
          output.textContent =
            JSON.stringify(data, null, 2);
        }

      } catch (err) {
        output.textContent = err.message;
      }
    }
  </script>

</body>
</html>
